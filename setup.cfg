[flake8]
max-line-length = 119
ignore =
    W503
exclude =
    tests,
    migrations,
    venv,
    env,
    docs,
    frontend,
    nginx,
    build_doc.py,
    make_component_diagram.py,
    make_deployment_concept.py,
    make_deployment_container.py,
    make_er_diagram.py,
    make_logo_concepts.py,
    make_logo_final.py,
    make_sequence_diagrams.py,
    make_usecase_diagram.py
per-file-ignores =
    */settings.py:E501
