services:
  db:
    image: postgres:15
    container_name: pdd_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdd_service}
      POSTGRES_USER: ${POSTGRES_USER:-pdd_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdd_service}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: pdd_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_media:/app/static
      - media_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 8000), timeout=2)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  nginx:
    image: nginx:latest
    container_name: pdd_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_media:/app/static:ro
      - media_data:/app/media:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  static_media:
  media_data:
